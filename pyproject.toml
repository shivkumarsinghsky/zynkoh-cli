[project]
name = "zynkoh-cli"
version = "1.1.0"
description = "Code generator CLI for Clean Architecture FastAPI modules in a multi-tenant SaaS backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Shiv Kumar" }
]
license = { text = "MIT" }
keywords = ["code-generator", "cli", "fastapi", "sqlalchemy", "clean-architecture", "hexagonal-architecture", "multi-tenant", "saas", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "inflect>=7.3.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/shivkumarsinghsky/zynkoh-cli"
Documentation = "https://github.com/shivkumarsinghsky/zynkoh-cli/blob/main/docs/architecture.md"
Changelog = "https://github.com/shivkumarsinghsky/zynkoh-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "fastapi>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "pydantic-settings>=2.3.0",
]

[project.scripts]
zynkoh = "zynkoh_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zynkoh_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zynkoh_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
disallow_untyped_defs = true